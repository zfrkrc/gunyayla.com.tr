services:

  # ── 1. MySQL — Ghost için ────────────────────────────────────
  ghost_db:
    image: mysql:8.0
    container_name: ghost_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ghost_db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. PostgreSQL — Better Auth için ────────────────────────
  auth_db:
    image: postgres:16-alpine
    container_name: auth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. Ghost CMS (Headless API modu) ────────────────────────
  ghost:
    image: ghost:5-alpine
    container_name: ghost_cms
    restart: unless-stopped
    depends_on:
      ghost_db:
        condition: service_healthy
    environment:
      url: https://${SITE_DOMAIN}
      NODE_ENV: production
      database__client: mysql
      database__connection__host: ghost_db
      database__connection__port: 3306
      database__connection__database: ${MYSQL_DATABASE}
      database__connection__user: ${MYSQL_USER}
      database__connection__password: ${MYSQL_PASSWORD}
      privacy__useUpdateCheck: "false"
      privacy__useGravatar: "false"
      mail__transport: SMTP
      mail__options__host: postaci.zaferkaraca.net
      mail__options__port: 587
      mail__options__secure: "false"
      mail__options__auth__user: admin@gunyayla.com.tr
      mail__options__auth__pass: "${SMTP_PASS}"
      mail__from: admin@gunyayla.com.tr
      members__fromAddress: admin@gunyayla.com.tr
      security__staffDeviceVerification: "false"
    volumes:
      - ghost_content:/var/lib/ghost/content
      - ./ghost-content/themes:/var/lib/ghost/content/themes:rw
      - ./ghost-config.production.json:/var/lib/ghost/config.production.json:ro
    networks:
      - internal

  # ── 4. MinIO (S3 uyumlu obje depolama) ──────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 5. MinIO Bucket Setup ────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: minio_setup
    restart: no
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c '
      mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}" &&
      mc mb "local/${MINIO_BUCKET:-gunyayla}" --ignore-existing &&
      mc anonymous set download "local/${MINIO_BUCKET:-gunyayla}" &&
      echo "✅ MinIO bucket hazır"
      '
    networks:
      - internal

  # ── 6. Mailhog (fake SMTP) ──────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "0.0.0.0:8025:8025"
    networks:
      - internal

  # ── 7. Next.js Frontend ──────────────────────────────────────
  nextjs:
    build:
      context: ./nextjs
      dockerfile: Dockerfile
      args:
        BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
        BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
        GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
        GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
        NEXT_PUBLIC_SITE_URL: "${BETTER_AUTH_URL}"
        POSTGRES_HOST: "auth_db"
        POSTGRES_PORT: "5432"
        POSTGRES_USER: "${POSTGRES_USER}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_DB: "${POSTGRES_DB}"
        GHOST_URL: "http://ghost:2368"
        GHOST_CONTENT_API_KEY: "${GHOST_CONTENT_API_KEY}"
        GHOST_ADMIN_API_KEY: "${GHOST_ADMIN_API_KEY}"
        SMTP_HOST: "postaci.zaferkaraca.net"
        SMTP_PORT: "587"
        SMTP_USER: "admin@gunyayla.com.tr"
        SMTP_PASS: "${SMTP_PASS}"
        EMAIL_FROM: "${EMAIL_FROM}"
        SITE_NAME: "${SITE_NAME:-gunyayla.com.tr}"
        MINIO_ENDPOINT: "minio:9000"
        MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
        MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
        MINIO_BUCKET: "${MINIO_BUCKET:-gunyayla}"
        MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL}"
        UPLOAD_SECRET: "${UPLOAD_SECRET}"
    container_name: nextjs_app
    restart: unless-stopped
    depends_on:
      auth_db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SITE_URL: "${BETTER_AUTH_URL}"
      SITE_DOMAIN: "${SITE_DOMAIN}"
      GHOST_URL: "http://ghost:2368"
      GHOST_CONTENT_API_KEY: "${GHOST_CONTENT_API_KEY}"
      GHOST_ADMIN_API_KEY: "${GHOST_ADMIN_API_KEY}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      POSTGRES_HOST: "auth_db"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth_db:5432/${POSTGRES_DB}"
      NEXT_PUBLIC_GA_ID: "${NEXT_PUBLIC_GA_ID}"
      MYSQL_HOST: ghost_db
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DB: "${MYSQL_DATABASE}"
      SMTP_HOST: postaci.zaferkaraca.net
      SMTP_PORT: "587"
      SMTP_USER: admin@gunyayla.com.tr
      SMTP_PASS: "${SMTP_PASS}"
      EMAIL_FROM: "${EMAIL_FROM}"
      SITE_NAME: "${SITE_NAME:-gunyayla.com.tr}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-gunyayla}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL}"
      UPLOAD_SECRET: "${UPLOAD_SECRET}"
    volumes:
      - bot_data:/data
    networks:
      - internal

  # ── 8. Ollama (AI özet için) ────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal

  # ── 9. RSS Bot (2 saatte bir çalışır) ───────────────────────
  rss-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: rss_bot
    restart: unless-stopped
    depends_on:
      - ollama
      - ghost
    environment:
      GHOST_URL: "http://ghost:2368"
      GHOST_ADMIN_API_KEY: "${GHOST_ADMIN_API_KEY}"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "gemma3:1b"
      SITE_URL: "https://gunyayla.com.tr"
      WHATSAPP_NOTIFY_URL: "http://whatsapp-bot:3000/notify"
    volumes:
      - bot_data:/data
    networks:
      - internal

  # ── 10. WhatsApp Bot (BuilderBot + Baileys) ─────────────────
  whatsapp-bot:
    build:
      context: ./bot-whatsapp
      dockerfile: Dockerfile
    container_name: whatsapp_bot
    restart: unless-stopped
    depends_on:
      - ghost
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      GHOST_URL: "http://ghost:2368"
      GHOST_CONTENT_API_KEY: "${GHOST_CONTENT_API_KEY}"
      ADMIN_NUMBERS: "${WHATSAPP_ADMIN_NUMBERS}"
      PORT: "3000"
    volumes:
      - whatsapp_data:/app/sessions
    networks:
      - internal

  # ── 11. Nginx — Tek giriş noktası (port 80) ─────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PUBLIC_HTTP_PORT}:80"
    depends_on:
      - ghost
      - nextjs
      - minio
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal

volumes:
  ghost_db_data:
  auth_db_data:
  ghost_content:
  minio_data:
  ollama_data:
  bot_data:
  whatsapp_data:

networks:
  internal:
    driver: bridge
